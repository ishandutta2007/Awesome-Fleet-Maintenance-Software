<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 900;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #a0aec0;
      letter-spacing: 0.5px;
    }
    .tag-text {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #00f2fe;
    }
    
    /* Dynamic Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -80; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(6px); }
    }
    @keyframes rotateGear {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes rotateGearRev {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes signalBlink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    .pulse-elem {
      animation: pulseGlow 4s ease-in-out infinite;
      transform-origin: center;
    }
    .dash-stream {
      stroke-dasharray: 8 12;
      animation: dashMove 2.5s linear infinite;
    }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite reverse; }
    .gear-main {
      animation: rotateGear 18s linear infinite;
      transform-origin: 990px 145px;
    }
    .gear-small {
      animation: rotateGearRev 12s linear infinite;
      transform-origin: 1065px 205px;
    }
    .signal-1 { animation: signalBlink 2s ease-in-out infinite; }
    .signal-2 { animation: signalBlink 2s ease-in-out infinite 0.7s; }
    .signal-3 { animation: signalBlink 2s ease-in-out infinite 1.4s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Glowing background blobs -->
  <circle cx="1000" cy="150" r="120" fill="#00f2fe" opacity="0.08" class="pulse-elem"/>
  <circle cx="200" cy="80" r="100" fill="#ff9900" opacity="0.05" class="pulse-elem"/>

  <!-- Border Frame -->
  <rect x="2" y="2" width="1196" height="316" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Decorative Circuit / Telematics Data Stream Lines -->
  <path d="M 60 270 L 320 270 L 370 230 L 750 230" fill="none" stroke="#4facfe" stroke-width="2" stroke-opacity="0.3"/>
  <path d="M 60 270 L 320 270 L 370 230 L 750 230" fill="none" stroke="#00f2fe" stroke-width="2" class="dash-stream" opacity="0.8"/>

  <path d="M 150 50 L 400 50 L 440 90 L 700 90" fill="none" stroke="#ff9900" stroke-width="1.5" stroke-opacity="0.2"/>
  <path d="M 150 50 L 400 50 L 440 90 L 700 90" fill="none" stroke="#ffaa00" stroke-width="1.5" class="dash-stream" opacity="0.6"/>

  <!-- Floating Ambient Particles -->
  <circle cx="120" cy="110" r="3" fill="#00f2fe" class="particle-1" opacity="0.7"/>
  <circle cx="280" cy="45" r="2" fill="#4facfe" class="particle-2" opacity="0.8"/>
  <circle cx="680" cy="70" r="3.5" fill="#00f2fe" class="particle-1" opacity="0.6"/>
  <circle cx="560" cy="280" r="2.5" fill="#ffaa00" class="particle-2" opacity="0.6"/>

  <!-- Left Content: Badges & Headings -->
  <!-- Category Badge -->
  <g transform="translate(60, 48)">
    <rect width="180" height="28" rx="14" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#00f2fe" class="signal-1"/>
    <text x="26" y="19" class="tag-text">FLEET CMMS &amp; TELEMATICS</text>
  </g>

  <g transform="translate(250, 48)">
    <rect width="140" height="28" rx="14" fill="#ff9900" fill-opacity="0.12" stroke="#ff9900" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#ff9900" class="signal-2"/>
    <text x="26" y="19" class="tag-text" fill="#ffaa00" style="fill: #ffaa00;">CURATED DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="130" class="title-text">
    Awesome <tspan fill="url(#accentGrad)">Fleet Maintenance</tspan>
  </text>
  <text x="60" y="172" class="title-text" font-size="34" fill="#e2e8f0">
    Software &amp; Systems
  </text>

  <!-- Subtitle -->
  <text x="60" y="212" class="subtitle-text">
    Preventive Maintenance • Work Orders • DVIR Inspections • Parts Inventory • Telematics
  </text>

  <!-- Metric Pills / Tags -->
  <g transform="translate(60, 240)">
    <rect width="125" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">🚚 Fleet CMMS</text>
  </g>
  <g transform="translate(195, 240)">
    <rect width="130" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">📋 Digital DVIR</text>
  </g>
  <g transform="translate(335, 240)">
    <rect width="130" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">⚡ Open-Source</text>
  </g>
  <g transform="translate(475, 240)">
    <rect width="125" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">💰 SaaS Pricing</text>
  </g>

  <!-- Right Visual Graphics: Dynamic Telematics & Maintenance Gear System -->
  <!-- Telematics Radar Waves -->
  <g transform="translate(990, 145)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 8" class="signal-1"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#4facfe" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="6 12" class="signal-2"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.3" class="signal-3"/>
  </g>

  <!-- Main Rotating Gear -->
  <g class="gear-main" filter="url(#subtleGlow)">
    <path d="M 990 85 
             L 998 85 L 1001 98 L 1012 102 L 1023 93 L 1030 98 L 1029 112 L 1039 119 L 1052 114 L 1056 122 L 1049 134 L 1055 145 L 1069 146 L 1070 155 L 1058 163 L 1057 174 L 1068 183 L 1063 191 L 1050 190 L 1043 200 L 1047 213 L 1039 218 L 1029 209 L 1018 216 L 1014 229 L 1005 231 L 999 219 L 988 221 L 981 233 L 973 231 L 974 217 L 963 212 L 951 220 L 945 213 L 950 201 L 943 191 L 930 190 L 929 181 L 940 173 L 939 161 L 926 154 L 928 145 L 941 143 L 945 132 L 938 120 L 945 113 L 958 117 L 967 109 L 966 96 L 975 92 L 983 103 L 994 99 Z"
          fill="#1e293b" stroke="#00f2fe" stroke-width="2.5" stroke-opacity="0.8"/>
    <circle cx="990" cy="145" r="32" fill="#0f172a" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="990" cy="145" r="12" fill="#00f2fe" opacity="0.9"/>
  </g>

  <!-- Secondary Intermeshed Rotating Gear -->
  <g class="gear-small">
    <path d="M 1065 175 
             L 1070 175 L 1072 183 L 1079 185 L 1085 180 L 1090 183 L 1089 191 L 1095 195 L 1103 192 L 1106 197 L 1101 204 L 1104 211 L 1112 212 L 1113 218 L 1105 222 L 1104 229 L 1110 234 L 1107 239 L 1099 238 L 1095 244 L 1097 251 L 1092 254 L 1086 249 L 1080 252 L 1077 260 L 1071 261 L 1067 254 L 1061 254 L 1056 261 L 1051 259 L 1052 251 L 1046 247 L 1039 251 L 1035 247 L 1038 240 L 1034 234 L 1026 233 L 1025 228 L 1032 223 L 1032 216 L 1024 212 L 1025 207 L 1033 205 L 1035 199 L 1031 192 L 1035 188 L 1043 190 L 1048 185 L 1048 178 L 1053 175 L 1058 181 L 1064 179 Z"
          fill="#1e293b" stroke="#ff9900" stroke-width="2" stroke-opacity="0.8"/>
    <circle cx="1065" cy="205" r="20" fill="#0f172a" stroke="#ff9900" stroke-width="1.5"/>
    <circle cx="1065" cy="205" r="7" fill="#ff9900" opacity="0.9"/>
  </g>

  <!-- Diagnostic Fleet Vehicle Silhouette & Wrench Icon -->
  <g transform="translate(860, 195)">
    <!-- Diagnostic Telematics Box -->
    <rect width="90" height="48" rx="8" fill="#0f172a" stroke="#4facfe" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="16" cy="18" r="4" fill="#00f2fe" class="signal-1"/>
    <text x="26" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">DTC : OK</text>
    <text x="12" y="38" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="#38bdf8">99.8% UPTIME</text>
  </g>

</svg>
